<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Our Swear Jar</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff8f5;color:#282421;margin:0}.app{max-width:620px;margin:auto;padding:28px 16px}h1{text-align:center;margin:0}.sub{text-align:center;color:#817873;margin:6px 0 22px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card,.panel{background:#fff;border:1px solid #eadfd9;border-radius:20px;padding:18px}.card{text-align:center}.n{font-size:50px;font-weight:800;margin:8px}.swear{width:100%;padding:14px;border:0;border-radius:13px;background:#eee5ff;color:#604493;font-weight:800;font-size:15px}.cardWord{display:block;box-sizing:border-box;width:100%;max-width:100%;margin:10px 0 8px;padding:10px 8px;border:1px solid #eadfd9;border-radius:11px;background:#fff;font-size:13px;text-align:center}.panel{margin-top:14px}.form{display:grid;grid-template-columns:90px 1fr auto;gap:8px}select,input{padding:12px;border:1px solid #eadfd9;border-radius:11px;background:#fff;font-size:15px;min-width:0}.add{border:0;border-radius:11px;padding:0 16px;background:#282421;color:#fff;font-weight:700}.top{display:flex;justify-content:space-between;align-items:center}.clear{border:0;background:none;color:#a25d67}.entry{padding:11px 0;border-bottom:1px solid #f0e8e4;display:flex;justify-content:space-between;gap:12px;align-items:center}.entryText{flex:1}.del{border:0;background:#fff0f1;color:#a25d67;border-radius:10px;padding:7px 10px;font-size:12px;font-weight:700;cursor:pointer}.word{color:#7654a9;font-weight:700}.time{font-size:12px;color:#817873;margin-top:3px}.empty{text-align:center;color:#817873;padding:18px}
@media(max-width:480px){.form{grid-template-columns:1fr 1fr}.form input{grid-column:1/3}.add{padding:12px}}
.overlay{position:fixed;inset:0;background:rgba(40,36,33,.48);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.overlay.show{display:flex}.modal{position:relative;box-sizing:border-box;width:100%;max-width:380px;background:#fff;border:1px solid #eadfd9;border-radius:24px;padding:30px 24px 24px;text-align:center;box-shadow:0 18px 50px rgba(40,36,33,.2);animation:pop .18s ease-out}@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}.x{position:absolute;top:10px;right:11px;border:0;background:none;padding:6px 9px;font-size:19px;line-height:1;color:#817873;cursor:pointer}.x:hover{color:#282421}.kicker{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#a25d67;font-weight:800}.who{margin:9px 0 0;color:#817873;font-size:14px}.punish{font-size:19px;font-weight:700;line-height:1.45;margin:16px 0 22px}.regen{width:100%;padding:14px;border:0;border-radius:13px;background:#eee5ff;color:#604493;font-weight:800;font-size:15px;cursor:pointer}
</style></head><body><div class="app"><h1>Our Swear Jar 🤬</h1><div class="sub">Just keeping score.</div>
<div class="cards">
<div class="card"><b>She</b><div id="she" class="n">0</div><input id="sheWord" class="cardWord" placeholder="Comment (optional)"><button class="swear" onclick="addFromCard('She','sheWord')">She Swore 🤬</button></div>
<div class="card"><b>He</b><div id="he" class="n">0</div><input id="heWord" class="cardWord" placeholder="Comment (optional)"><button class="swear" onclick="addFromCard('He','heWord')">He Swore 🤬</button></div>
</div>
<div class="panel"><div class="top"><b>History</b><button class="clear" onclick="clearAll()">Clear all</button></div><div id="history"></div></div></div>
<div id="overlay" class="overlay" onclick="if(event.target===this)closePunishment()"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="punishText">
<button class="x" type="button" aria-label="Close" onclick="closePunishment()">&#10005;</button>
<div class="kicker">20 swears &middot; punishment time</div>
<p class="who" id="punishWho"></p>
<p class="punish" id="punishText"></p>
<button class="regen" type="button" onclick="newPunishment()">Generate new punishment &#10024;</button>
</div></div>
<script>
(function(){
"use strict";
var BASE="https://vutuvncreqnmhaardmov.supabase.co";
var KEY="sb_publishable_00Y9u5apokZJp22rkn2jiQ_dR9OUB0K";
var API=BASE+"/rest/v1/swears";
var entries=[];
var counts={She:0,He:0};
var PUNISHMENTS=[
  "Send 5 reasons why you love your partner",
  "Plan a cute city date",
  "Plan a cute nature date to somewhere we've never been",
  "Write a love letter by hand and hide it where they'll find it",
  "Make your partner breakfast in bed this weekend",
  "Give a 10-minute back massage, no phones allowed",
  "Plan a picnic packed with all of their favourite snacks",
  "Make a playlist of 10 songs that remind you of them",
  "Cook their favourite meal completely from scratch",
  "Send a voice note about one thing you're grateful for today",
  "Plan a movie night: they pick the film, you make the snacks",
  "Recreate your first date as closely as you can",
  "Take them out for dessert, your treat",
  "Write down 3 memories you never want to forget and read them out loud",
  "Plan a sunrise or sunset walk together this week",
  "Surprise them with a tiny gift under $10, just because",
  "Give them 20 compliments in one day, one at a time",
  "Draw a (lovingly terrible) portrait of your partner and gift it",
  "Plan a coffee shop crawl and try somewhere brand new",
  "Let them choose dinner every night for a week",
  "Make a photo collage of your favourite pictures together",
  "Plan a day trip to a town neither of you has visited",
  "Do their least favourite chore for a week without being asked",
  "Write a poem about your partner, good or gloriously bad",
  "Plan an at-home spa night with candles and face masks",
  "Send a cute good-morning text every day for a week",
  "Learn to make their favourite dessert and surprise them with it",
  "Plan a stargazing night with blankets and hot drinks",
  "Give them a 60-second hug with zero talking",
  "Plan a themed dinner night at home, dress code included",
  "Write a list of 10 things you want to do together this year",
  "Take them to a gallery, museum, or exhibition they'd love",
  "Plan a game night and let them pick every single game",
  "Surprise them with their favourite drink on a random afternoon",
  "Make a scrapbook page about your favourite day together",
  "Plan a bike ride or long walk somewhere green",
  "Tell them 5 things you're excited to do together in the future",
  "Give them one whole evening of undivided attention, phone in another room",
  "Plan a farmers market trip and cook whatever you find together",
  "Write \"why I'd pick you again\" in 5 sentences and send it",
  "Plan a beach or lake day, snacks included",
  "Reenact a cheesy romantic movie scene for them",
  "Plan a bookshop date and buy each other a book",
  "Make a handmade coupon book with 5 cute favours",
  "Plan a slow morning together: no alarms, no plans, just breakfast",
  "Send a photo of something today that made you think of them",
  "Plan a hike to a viewpoint you've never seen before",
  "Serenade your partner with a song, badly is better",
  "Plan a dinner date at a restaurant on their wishlist",
  "Write a thank-you note for something small they always do"
];

function headers(extra){
  var h={"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json"};
  if(extra){for(var k in extra)h[k]=extra[k];}
  return h;
}
function safe(t){var d=document.createElement("div");d.textContent=t==null?"":String(t);return d.innerHTML;}

async function load(){
  try{
    var r=await fetch(API+"?select=id,person,word,created_at&order=created_at.desc",{headers:headers()});
    if(!r.ok) throw new Error(await r.text());
    entries=await r.json();
    render();
  }catch(e){
    document.getElementById("history").innerHTML='<div class="empty">Could not connect to the shared database.<br><small>'+safe(e.message)+'</small></div>';
  }
}

async function addFromCard(person,inputId){
  var field=document.getElementById(inputId);
  var word=field.value.trim();
  var r=await fetch(API,{method:"POST",headers:headers({"Prefer":"return=representation"}),body:JSON.stringify({person:person,word:word||null})});
  if(!r.ok){alert("Could not add swear: "+await r.text());return;}
  field.value="";
  await load();
  var mine=counts[label(person)]||0;
  if(mine>0&&mine%20===0)showPunishment(label(person),mine);
}

async function deleteEntry(id){
  var r=await fetch(API+"?id=eq."+encodeURIComponent(id),{method:"DELETE",headers:headers()});
  if(!r.ok){alert("Could not delete: "+await r.text());return;}
  await load();
}

async function clearAll(){
  var r=await fetch(API+"?id=gt.0",{method:"DELETE",headers:headers()});
  if(!r.ok){alert("Could not clear history: "+await r.text());return;}
  await load();
}

function label(person){
  if(person==="Me")return "She";
  if(person==="Him")return "He";
  return person;
}

function render(){
  var she=0,he=0,h="";
  for(var i=0;i<entries.length;i++){
    var e=entries[i];
    var who=label(e.person);
    if(who==="She")she++;
    if(who==="He")he++;
    var d=new Date(e.created_at);
    h+='<div class="entry"><div class="entryText"><b>'+safe(who)+'</b>'+(e.word?' · <span class="word">'+safe(e.word)+'</span>':'')+'<div class="time">'+d.toLocaleString()+'</div></div><button class="del" type="button" onclick="deleteEntry('+Number(e.id)+')">Delete</button></div>';
  }
  counts.She=she;counts.He=he;
  document.getElementById("she").textContent=she;
  document.getElementById("he").textContent=he;
  document.getElementById("history").innerHTML=h||'<div class="empty">No swears yet 😇</div>';
}

function newPunishment(){
  var pick=PUNISHMENTS[Math.floor(Math.random()*PUNISHMENTS.length)];
  document.getElementById("punishText").textContent=pick;
}

function showPunishment(who,total){
  var name=who==="She"?"She":"He";
  document.getElementById("punishWho").textContent=name+" just hit "+total+" swears \u2014 time to make up for it \ud83d\udc95";
  newPunishment();
  document.getElementById("overlay").classList.add("show");
}

function closePunishment(){
  document.getElementById("overlay").classList.remove("show");
}

document.addEventListener("keydown",function(e){if(e.key==="Escape")closePunishment();});

window.newPunishment=newPunishment;
window.closePunishment=closePunishment;
window.addFromCard=addFromCard;
window.deleteEntry=deleteEntry;
window.clearAll=clearAll;
load();
})();
</script></body></html>
